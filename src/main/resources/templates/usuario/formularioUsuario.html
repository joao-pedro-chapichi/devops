<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Usuário</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;

            background:
                radial-gradient(circle at top left, #4f8cff 0%, transparent 35%),
                radial-gradient(circle at bottom right, #00b4d8 0%, transparent 30%),
                linear-gradient(135deg, #081b33, #0d47a1);

            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";

            position: fixed;

            border-radius: 50%;

            filter: blur(10px);

            opacity: 0.3;

            pointer-events: none;
        }

        body::before {
            width: 300px;
            height: 300px;

            background: #00d4ff;

            top: -100px;
            right: -80px;
        }

        body::after {
            width: 250px;
            height: 250px;

            background: #6c63ff;

            bottom: -100px;
            left: -80px;
        }

        .container {
            position: relative;

            z-index: 1;

            width: 420px;

            padding: 45px 40px;

            background: rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 24px;

            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);

            animation: aparecer 0.7s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 20px;

            background: linear-gradient(135deg, #2196f3, #00c6ff);

            font-size: 32px;

            box-shadow: 0 10px 30px rgba(0, 198, 255, 0.35);
        }

        h1 {
            text-align: center;

            color: #ffffff;

            font-size: 30px;

            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;

            color: rgba(255, 255, 255, 0.65);

            font-size: 15px;

            margin-bottom: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;

            font-size: 14px;

            font-weight: bold;

            color: rgba(255, 255, 255, 0.85);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;

            padding: 14px 15px;

            margin-bottom: 18px;

            border-radius: 10px;

            border: 1px solid rgba(255, 255, 255, 0.2);

            background: rgba(255, 255, 255, 0.08);

            color: white;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #42a5f5;

            background: rgba(255, 255, 255, 0.13);

            box-shadow:
                0 0 0 3px rgba(33, 150, 243, 0.15),
                0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .botao {
            width: 100%;

            padding: 15px;

            margin-top: 5px;

            border: none;

            border-radius: 12px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            color: white;

            background: linear-gradient(135deg, #2196f3, #0077ff);

            box-shadow: 0 8px 22px rgba(0, 119, 255, 0.3);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .botao:hover {
            transform: translateY(-3px);

            box-shadow: 0 12px 28px rgba(0, 119, 255, 0.45);
        }

        .botao:active {
            transform: translateY(0);
        }

        .linha {
            height: 1px;

            margin: 25px 0 20px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.25),
                transparent
            );
        }

        .voltar {
            display: block;

            width: 100%;

            padding: 14px;

            text-align: center;

            text-decoration: none;

            font-size: 15px;

            font-weight: bold;

            color: white;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.2);

            transition:
                background 0.25s ease,
                transform 0.25s ease;
        }

        .voltar:hover {
            background: rgba(255, 255, 255, 0.15);

            transform: translateY(-2px);
        }

        @media (max-width: 450px) {
            .container {
                width: 100%;

                padding: 40px 25px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="logo">
            👤
        </div>

        <h1>Cadastro de Usuário</h1>

        <p class="subtitulo">
            Crie sua conta para acessar o sistema
        </p>

        <form
            th:action="@{/usuarios/salvar}"
            method="post"
            th:object="${usuario}"
        >

            <input
                type="hidden"
                th:field="*{idUsuario}"
            >

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                th:field="*{nomeUsuario}"
                placeholder="Digite seu nome"
                required
            >

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                th:field="*{emailUsuario}"
                placeholder="Digite seu email"
                required
            >

            <label for="login">
                Login
            </label>

            <input
                type="text"
                id="login"
                th:field="*{loginUsuario}"
                placeholder="Escolha um login"
                required
            >

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                th:field="*{senhaUsuario}"
                placeholder="Crie uma senha"
                required
            >

            <input
                type="submit"
                value="Criar Conta"
                class="botao"
            >

        </form>

        <div class="linha"></div>

        <a href="/fatecads" class="voltar">
            Voltar para Home
        </a>

    </div>

</body>

</html>
