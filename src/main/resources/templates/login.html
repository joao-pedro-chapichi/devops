<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acesso ao Sistema</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #4f8cff 0%, transparent 35%),
                radial-gradient(circle at bottom right, #00b4d8 0%, transparent 30%),
                linear-gradient(135deg, #081b33, #0d47a1);

            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";

            position: absolute;

            border-radius: 50%;

            filter: blur(10px);

            opacity: 0.3;
        }

        body::before {
            width: 300px;
            height: 300px;

            background: #00d4ff;

            top: -100px;
            right: -80px;
        }

        body::after {
            width: 250px;
            height: 250px;

            background: #6c63ff;

            bottom: -100px;
            left: -80px;
        }

        .container {
            position: relative;

            z-index: 1;

            width: 390px;

            padding: 45px 40px;

            background: rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 24px;

            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);

            text-align: center;

            animation: aparecer 0.7s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 20px;

            background: linear-gradient(135deg, #2196f3, #00c6ff);

            font-size: 32px;

            box-shadow: 0 10px 30px rgba(0, 198, 255, 0.35);
        }

        h1 {
            color: #ffffff;

            font-size: 30px;

            margin-bottom: 8px;
        }

        .subtitulo {
            color: rgba(255, 255, 255, 0.65);

            font-size: 15px;

            margin-bottom: 30px;
        }

        form {
            display: flex;

            flex-direction: column;
        }

        label {
            text-align: left;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: bold;

            color: rgba(255, 255, 255, 0.85);
        }

        input {
            width: 100%;

            padding: 14px 15px;

            margin-bottom: 20px;

            border-radius: 10px;

            border: 1px solid rgba(255, 255, 255, 0.2);

            background: rgba(255, 255, 255, 0.08);

            color: white;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        input:focus {
            border-color: #42a5f5;

            background: rgba(255, 255, 255, 0.13);

            box-shadow:
                0 0 0 3px rgba(33, 150, 243, 0.15),
                0 5px 15px rgba(0, 0, 0, 0.15);
        }

        button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            color: white;

            background: linear-gradient(135deg, #2196f3, #0077ff);

            box-shadow: 0 8px 22px rgba(0, 119, 255, 0.3);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;

            margin-bottom: 12px;
        }

        button:hover {
            transform: translateY(-3px);

            box-shadow: 0 12px 28px rgba(0, 119, 255, 0.45);
        }

        button:active {
            transform: translateY(0);
        }

        .mensagem {
            margin: 10px 0 18px;

            padding: 12px;

            border-radius: 10px;

            font-size: 14px;

            font-weight: bold;
        }

        .erro {
            background: rgba(255, 82, 82, 0.15);

            color: #ffb3b3;

            border: 1px solid rgba(255, 82, 82, 0.35);
        }

        .sucesso {
            background: rgba(40, 167, 69, 0.15);

            color: #a5f3ba;

            border: 1px solid rgba(40, 167, 69, 0.35);
        }

        .linha {
            height: 1px;

            margin: 20px 0;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.25),
                transparent
            );
        }

        .btn-home {
            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.2);

            box-shadow: none;
        }

        .btn-home:hover {
            background: rgba(255, 255, 255, 0.15);

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        @media (max-width: 450px) {
            .container {
                width: calc(100% - 35px);

                padding: 40px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            🔐
        </div>

        <h1>Acesso ao Sistema</h1>

        <p class="subtitulo">
            Entre com suas credenciais para continuar
        </p>

        <form method="post" th:action="@{/login}">

            <label for="username">
                Usuário
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Digite seu usuário"
                required
            >

            <label for="password">
                Senha
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <p
            th:if="${param.error}"
            class="mensagem erro"
        >
            Usuário ou senha inválidos
        </p>

        <p
            th:if="${param.logout}"
            class="mensagem sucesso"
        >
            Logout efetuado com sucesso
        </p>

        <div class="linha"></div>

        <form action="/fatecads" method="get">

            <button
                type="submit"
                class="btn-home"
            >
                Voltar para Home
            </button>

        </form>

    </div>

</body>

</html>
