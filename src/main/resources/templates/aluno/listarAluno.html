<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Alunos</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            padding: 40px 20px;

            background:
                radial-gradient(circle at top left, #4f8cff 0%, transparent 35%),
                radial-gradient(circle at bottom right, #00b4d8 0%, transparent 30%),
                linear-gradient(135deg, #081b33, #0d47a1);

            color: white;
        }

        body::before,
        body::after {
            content: "";

            position: fixed;

            border-radius: 50%;

            filter: blur(15px);

            opacity: 0.3;

            pointer-events: none;
        }

        body::before {
            width: 300px;
            height: 300px;

            background: #00d4ff;

            top: -100px;
            right: -80px;
        }

        body::after {
            width: 250px;
            height: 250px;

            background: #6c63ff;

            bottom: -100px;
            left: -80px;
        }

        .container {
            position: relative;

            z-index: 1;

            max-width: 1450px;

            margin: 0 auto;

            animation: aparecer 0.7s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cabecalho {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 20px;

            margin-bottom: 25px;

            flex-wrap: wrap;
        }

        .titulo-area {
            display: flex;

            align-items: center;

            gap: 15px;
        }

        .icone {
            width: 65px;
            height: 65px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 18px;

            background: linear-gradient(135deg, #2196f3, #00c6ff);

            font-size: 30px;

            box-shadow: 0 10px 30px rgba(0, 198, 255, 0.35);
        }

        h1 {
            font-size: 32px;

            margin-bottom: 5px;
        }

        .subtitulo {
            color: rgba(255, 255, 255, 0.6);

            font-size: 14px;
        }

        .btn-novo {
            display: inline-block;

            padding: 14px 20px;

            border-radius: 12px;

            text-decoration: none;

            color: white;

            font-weight: bold;

            background: linear-gradient(135deg, #2196f3, #0077ff);

            box-shadow: 0 8px 22px rgba(0, 119, 255, 0.3);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .btn-novo:hover {
            transform: translateY(-3px);

            box-shadow: 0 12px 28px rgba(0, 119, 255, 0.45);
        }

        .tabela-card {
            background: rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 22px;

            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);

            overflow: hidden;
        }

        .tabela-scroll {
            width: 100%;

            overflow-x: auto;
        }

        table {
            width: 100%;

            min-width: 1300px;

            border-collapse: collapse;
        }

        th {
            padding: 16px 14px;

            text-align: left;

            background: rgba(0, 119, 255, 0.25);

            color: rgba(255, 255, 255, 0.9);

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        td {
            padding: 16px 14px;

            color: rgba(255, 255, 255, 0.82);

            font-size: 13px;

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);

            vertical-align: middle;
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .id {
            color: #67c7ff;

            font-weight: bold;
        }

        .nome {
            color: white;

            font-weight: bold;
        }

        .email {
            color: #b9dcff;
        }

        .ra {
            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            background: rgba(33, 150, 243, 0.15);

            border: 1px solid rgba(33, 150, 243, 0.25);

            color: #9ed9ff;

            font-size: 12px;

            font-weight: bold;
        }

        .curso {
            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            background: rgba(40, 167, 69, 0.12);

            border: 1px solid rgba(40, 167, 69, 0.25);

            color: #8de5af;

            font-size: 12px;

            font-weight: bold;
        }

        .acoes {
            display: flex;

            gap: 8px;

            white-space: nowrap;
        }

        .acoes a {
            text-decoration: none;

            color: white;

            padding: 8px 12px;

            border-radius: 8px;

            font-size: 13px;

            font-weight: bold;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .acoes a:hover {
            transform: translateY(-2px);
        }

        .editar {
            background: linear-gradient(135deg, #ffb300, #ff8f00);

            box-shadow: 0 5px 15px rgba(255, 179, 0, 0.2);
        }

        .editar:hover {
            box-shadow: 0 8px 20px rgba(255, 179, 0, 0.35);
        }

        .excluir {
            background: linear-gradient(135deg, #ef5350, #d32f2f);

            box-shadow: 0 5px 15px rgba(239, 83, 80, 0.2);
        }

        .excluir:hover {
            box-shadow: 0 8px 20px rgba(239, 83, 80, 0.35);
        }

        .rodape {
            margin-top: 20px;

            text-align: center;

            color: rgba(255, 255, 255, 0.4);

            font-size: 12px;
        }

        @media (max-width: 700px) {

            .cabecalho {
                flex-direction: column;

                align-items: stretch;
            }

            .titulo-area {
                justify-content: center;

                text-align: center;
            }

            .btn-novo {
                text-align: center;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="cabecalho">

            <div class="titulo-area">

                <div class="icone">
                    🎓
                </div>

                <div>

                    <h1>Lista de Alunos</h1>

                    <p class="subtitulo">
                        Gerencie os alunos cadastrados no sistema
                    </p>

                </div>

            </div>

            <a
                href="/alunos/criar"
                class="btn-novo"
            >
                + Novo Aluno
            </a>

        </div>


        <div class="tabela-card">

            <div class="tabela-scroll">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Telefone</th>
                            <th>Endereço</th>
                            <th>CPF</th>
                            <th>RA</th>
                            <th>Curso</th>
                            <th>Ações</th>

                        </tr>

                    </thead>


                    <tbody>

                        <tr th:each="aluno : ${alunos}">

                            <td
                                class="id"
                                th:text="${aluno.idAluno}"
                            >
                                *
                            </td>


                            <td
                                class="nome"
                                th:text="${aluno.nomeAluno}"
                            >
                                *
                            </td>


                            <td
                                class="email"
                                th:text="${aluno.emailAluno}"
                            >
                                *
                            </td>


                            <td
                                th:text="${aluno.telefoneAluno}"
                            >
                                *
                            </td>


                            <td
                                th:text="${aluno.enderecoAluno}"
                            >
                                *
                            </td>


                            <td
                                th:text="${aluno.cpfAluno}"
                            >
                                *
                            </td>


                            <td>

                                <span
                                    class="ra"
                                    th:text="${aluno.raAluno}"
                                >
                                    *
                                </span>

                            </td>


                            <td>

                                <span
                                    class="curso"
                                    th:text="${aluno.curso.nomeCurso}"
                                >
                                    *
                                </span>

                            </td>


                            <td>

                                <div class="acoes">

                                    <a
                                        th:href="@{/alunos/editar/{id}(id=${aluno.idAluno})}"
                                        class="editar"
                                    >
                                        Editar
                                    </a>

                                    <a
                                        th:href="@{/alunos/excluir/{id}(id=${aluno.idAluno})}"
                                        class="excluir"
                                    >
                                        Excluir
                                    </a>

                                </div>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <div class="rodape">
            FatecADS • Gerenciamento de Alunos
        </div>

    </div>

</body>

</html>
