<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            transition: 0.2s;
        }

        input[type="text"]:focus {
            border-color: #007bff;
            outline: none;
        }

        .botao {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .botao:hover {
            background-color: #0056b3;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #555;
        }

        .voltar:hover {
            text-decoration: underline;
        }

        input[type="file"] {
            width: 100%;
            margin-top: 8px;
            box-sizing: border-box;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Cadastro de Produtos</h1>

        <form th:action="@{/produtos/salvar}" method="post" th:object="${produto}" enctype="multipart/form-data">

            <input type="hidden" name="idProduto" th:field="*{idProduto}">

            <label for="descricaoProduto">Descrição do Produto</label>
            <input type="text" name="descricaoProduto" id="descricaoProduto" th:field="*{descricaoProduto}" required>

            <label for="valorProduto">Valor do Produto</label>
            <input type="text" name="valorProduto" id="valorProduto" th:field="*{valorProduto}" required>

            <label for="unidadeProduto">Unidade</label>
            <input type="text" name="unidadeProduto" id="unidadeProduto" th:field="*{unidadeProduto}" required>

            <label for="marcaProduto">Marca</label>
            <input type="text" name="marcaProduto" id="marcaProduto" th:field="*{marcaProduto}" required>

            <label for="imagem">Imagem do Produto</label>
            <input type="file" name="imagem" id="imagem" accept="image/*">

            <input type="submit" value="Salvar Produto" class="botao">

        </form>

        <a href="/produtos/listar" class="voltar">Voltar para lista</a>

    </div>

</body>

</html>
