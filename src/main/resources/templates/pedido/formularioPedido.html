<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Pedido</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            background:
                radial-gradient(circle at top left, #4f8cff 0%, transparent 35%),
                radial-gradient(circle at bottom right, #00b4d8 0%, transparent 30%),
                linear-gradient(135deg, #081b33, #0d47a1);
            color: white;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(15px);
            opacity: 0.3;
            pointer-events: none;
        }

        body::before {
            width: 300px;
            height: 300px;
            background: #00d4ff;
            top: -100px;
            right: -80px;
        }

        body::after {
            width: 250px;
            height: 250px;
            background: #6c63ff;
            bottom: -100px;
            left: -80px;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            animation: aparecer 0.7s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .titulo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icone {
            width: 65px;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 18px;
            background: linear-gradient(135deg, #2196f3, #00c6ff);
            font-size: 30px;
            box-shadow: 0 10px 30px rgba(0, 198, 255, 0.35);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .subtitulo {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .voltar {
            padding: 12px 18px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition:
                background 0.25s ease,
                transform 0.25s ease;
        }

        .voltar:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .painel {
            padding: 30px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .secao {
            margin-bottom: 30px;
        }

        .secao:last-child {
            margin-bottom: 0;
        }

        .secao-titulo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            font-size: 17px;
            font-weight: bold;
            color: white;
        }

        .numero {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 9px;
            background: linear-gradient(135deg, #2196f3, #0077ff);
            font-size: 13px;
            box-shadow: 0 5px 15px rgba(0, 119, 255, 0.25);
        }

        .linha {
            height: 1px;
            margin: 28px 0;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.22),
                    transparent);
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 14px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 14px;
            outline: none;
            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.42);
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #42a5f5;
            background: rgba(255, 255, 255, 0.13);
            box-shadow:
                0 0 0 3px rgba(33, 150, 243, 0.15),
                0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .campos-produto {
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 15px;
            align-items: end;
        }

        .campo {
            width: 100%;
        }

        .botao-adicionar {
            margin-top: 15px;
            padding: 13px 20px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 7px 20px rgba(40, 167, 69, 0.25);
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .botao-adicionar:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
        }

        .tabela-container {
            margin-top: 25px;
            border-radius: 16px;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        table {
            width: 100%;
            min-width: 750px;
            border-collapse: collapse;
        }

        th {
            padding: 15px;
            text-align: left;
            background: rgba(0, 119, 255, 0.25);
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        td {
            padding: 15px;
            color: rgba(255, 255, 255, 0.82);
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .empty-row td {
            padding: 35px;
            text-align: center;
            color: rgba(255, 255, 255, 0.45);
        }

        .quantidade-tabela {
            width: 70px;
            padding: 8px;
            text-align: center;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            outline: none;
        }

        .quantidade-tabela:focus {
            border-color: #42a5f5;
        }

        .btn-remove {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #ef5350, #d32f2f);
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .btn-remove:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(239, 83, 80, 0.3);
        }

        .resumo {
            display: flex;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .total {
            min-width: 280px;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            font-weight: bold;
        }

        #totalPedido {
            color: #82e6b0;
            font-size: 21px;
        }

        .botao-salvar {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #2196f3, #0077ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(0, 119, 255, 0.3);
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .botao-salvar:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0, 119, 255, 0.45);
        }

        .rodape {
            margin-top: 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }

        @media (max-width: 700px) {
            body {
                padding: 25px 15px;
            }

            .cabecalho {
                flex-direction: column;
                align-items: stretch;
            }

            .titulo-area {
                justify-content: center;
                text-align: center;
            }

            .voltar {
                text-align: center;
            }

            .painel {
                padding: 22px;
            }

            .campos-produto {
                grid-template-columns: 1fr;
            }

            .resumo {
                justify-content: stretch;
            }

            .total {
                width: 100%;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>

</head>

<body>

    <div class="container">
        <div class="cabecalho">
            <div class="titulo-area">
                <div class="icone">
                    🛒
                </div>

                <div>

                    <h1>Cadastro de Pedido</h1>

                    <p class="subtitulo">
                        Selecione o aluno e adicione os produtos ao pedido
                    </p>

                </div>

            </div>

            <a th:href="@{/home}" class="voltar">
                ← Voltar
            </a>

        </div>


        <div class="painel">
            <datalist id="listaAlunos">

                <option th:each="aluno : ${alunos}" th:value="${aluno.idAluno + ' - ' + aluno.nomeAluno}">
                </option>
            </datalist>


            <datalist id="listaProdutos">
                <option th:each="produto : ${produtos}"
                    th:value="${produto.idProduto + ' - ' + produto.descricaoProduto}"
                    th:attr="data-preco=${produto.valorProduto}">
                </option>
            </datalist>


            <div class="secao">
                <div class="secao-titulo">
                    <div class="numero">
                        1
                    </div>

                    Identificação do Aluno

                </div>
                <label for="aluno">
                    Aluno
                </label>

                <input list="listaAlunos" id="aluno" type="text" placeholder="Digite o nome ou código do aluno">

            </div>


            <div class="linha"></div>


            <div class="secao">
                <div class="secao-titulo">
                    <div class="numero">
                        2
                    </div>

                    Adicionar Produto

                </div>


                <div class="campos-produto">
                    <div class="campo">
                        <label for="produto">
                            Produto
                        </label>
                        <input type="text" placeholder="Digite ou selecione o produto" id="produto"
                            list="listaProdutos">
                    </div>


                    <div class="campo">
                        <label for="quantidade">
                            Quantidade
                        </label>
                        <input type="number" id="quantidade" placeholder="1" min="1">
                    </div>
                </div>


                <button type="button" class="botao-adicionar" onclick="adicionarItem()">
                    + Adicionar Produto
                </button>

            </div>


            <div class="linha"></div>


            <div class="secao">
                <div class="secao-titulo">
                    <div class="numero">
                        3
                    </div>
                    Itens do Pedido

                </div>


                <div class="tabela-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Produto</th>
                                <th>Quantidade</th>
                                <th>Preço Unit.</th>
                                <th>Subtotal</th>
                                <th>Ação</th>

                            </tr>

                        </thead>

                        <tbody id="tabela-itens">
                            <tr id="empty-row" class="empty-row">
                                <td colspan="5">
                                    Nenhum produto adicionado ao pedido
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>


                <div class="resumo">
                    <div class="total">
                        <span>
                            Total do Pedido
                        </span>

                        <span id="totalPedido">
                            R$ 0,00
                        </span>

                    </div>

                </div>


                <button type="button" class="botao-salvar" onclick="salvarPedido()">
                    Confirmar e Salvar Pedido
                </button>

            </div>

        </div>


        <div class="rodape">
            FatecADS • Gerenciamento de Pedidos
        </div>

    </div>


    <script>

        let itens = [];


        function adicionarItem() {

            let produtoInput =
                document.getElementById("produto").value;

            let quantidade =
                document.getElementById("quantidade").value;


            if (!produtoInput || quantidade <= 0) {

                alert(
                    "Preencha corretamente o produto e a quantidade!"
                );

                return;
            }


            let partes =
                produtoInput.split(" - ");


            let produtoId =
                partes[0];

            let produtoNome =
                partes[1];


            let options =
                document.querySelectorAll(
                    "#listaProdutos option"
                );


            let preco = null;


            options.forEach(opt => {

                if (opt.value === produtoInput) {

                    preco =
                        opt.getAttribute(
                            "data-preco"
                        );

                }

            });


            if (!preco) {

                alert(
                    "Produto inválido! Selecione um produto da lista."
                );

                return;
            }


            let subtotal =
                quantidade * preco;


            itens.push({

                produto: {
                    idProduto: produtoId
                },

                nomeProduto: produtoNome,

                quantidade:
                    parseInt(quantidade),

                preco:
                    parseFloat(preco),

                subtotal:
                    subtotal

            });


            document.getElementById("produto").value = "";

            document.getElementById("quantidade").value = "";


            renderTabela();

        }


        function removerItem(index) {

            itens.splice(index, 1);

            renderTabela();

        }


        function alterarQuantidade(
            index,
            novaQuantidade
        ) {

            novaQuantidade =
                parseInt(novaQuantidade);


            if (
                novaQuantidade <= 0 ||
                isNaN(novaQuantidade)
            ) {

                alert(
                    "A quantidade deve ser maior que zero!"
                );

                renderTabela();

                return;
            }


            itens[index].quantidade =
                novaQuantidade;


            itens[index].subtotal =
                itens[index].quantidade *
                itens[index].preco;


            renderTabela();

        }


        function renderTabela() {

            let tabela =
                document.getElementById(
                    "tabela-itens"
                );


            tabela.innerHTML = "";


            if (itens.length === 0) {

                tabela.innerHTML = `
                    <tr class="empty-row" id="empty-row">

                        <td colspan="5">

                            Nenhum produto adicionado ao pedido

                        </td>

                    </tr>
                `;


                document.getElementById(
                    "totalPedido"
                ).innerText =
                    "R$ 0,00";


                return;
            }


            let total = 0;


            itens.forEach(
                (item, index) => {

                    total +=
                        item.subtotal;


                    tabela.innerHTML += `

                        <tr>

                            <td>
                                ${item.nomeProduto}
                            </td>

                            <td>

                                <input
                                    type="number"
                                    class="quantidade-tabela"
                                    value="${item.quantidade}"
                                    min="1"
                                    onchange="alterarQuantidade(${index}, this.value)"
                                >

                            </td>

                            <td>

                                R$ ${item.preco
                            .toFixed(2)
                            .replace('.', ',')}

                            </td>

                            <td>

                                R$ ${item.subtotal
                            .toFixed(2)
                            .replace('.', ',')}

                            </td>

                            <td>

                                <button
                                    type="button"
                                    class="btn-remove"
                                    onclick="removerItem(${index})"
                                >

                                    Remover

                                </button>

                            </td>

                        </tr>

                    `;

                }
            );


            document.getElementById(
                "totalPedido"
            ).innerText =
                "R$ " +
                total
                    .toFixed(2)
                    .replace('.', ',');

        }


        function salvarPedido() {

            let alunoInput =
                document.getElementById(
                    "aluno"
                ).value;


            if (!alunoInput) {

                alert(
                    "Selecione um aluno antes de salvar!"
                );

                return;
            }


            if (itens.length === 0) {

                alert(
                    "Adicione ao menos um produto ao pedido!"
                );

                return;
            }


            let alunoId =
                alunoInput.split(" - ")[0];


            let pedido = {

                cliente: {
                    idAluno: alunoId
                },

                itens: itens

            };


            fetch("/pedidos", {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify(pedido)

            })

                .then(res => {

                    if (!res.ok) {

                        throw new Error(
                            "Erro ao salvar pedido"
                        );

                    }

                    return res.json();

                })

                .then(data => {

                    alert(
                        "Pedido salvo com sucesso!"
                    );

                    location.reload();

                })

                .catch(err => {

                    alert(
                        "Erro ao salvar o pedido. Tente novamente."
                    );

                    console.error(err);

                });

        }

    </script>

</body>

</html>
